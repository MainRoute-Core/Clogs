<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Clog Reader</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#181c24" />

  <!-- Marked.js Markdown Parser -->
  <script src="libs/marked.min.js"></script>
  <!-- GitHub Styled Markdown CSS -->
  <link rel="stylesheet" href="libs/github-markdown.min.css">
  <link rel="stylesheet" href="reader.css">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="shortcut icon" href="favicon.ico" type="image/x-icon">
  <!-- Fonts -->
  <link href="https://mainroute-core.github.io/src/CoreSans-Regular_en.otf" rel="stylesheet">
</head>

<body>

  <!-- READING PROGRESS BAR -->
  <div id="reading-progress-container" class="progress-container hidden">
    <div id="reading-progress-bar" class="progress-bar"></div>
  </div>

  <!-- INLINE SVGs -->
  <svg xmlns="http://www.w3.org/2000/svg" style="display: none;">
    <symbol id="icon-book" viewBox="0 0 24 24">
      <path d="M21 4H7c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zM7 18V6h14v12H7zM3 8h2v12H3z" />
    </symbol>
    <symbol id="icon-theme" viewBox="0 0 24 24">
      <path d="M12 3c-4.97 0-9 4.03-9 9s4.03 9 9 9 9-4.03 9-9c0-.46-.04-.92-.1-1.36-.98 1.37-2.58 2.26-4.4 2.26-2.98 0-5.4-2.42-5.4-5.4 0-1.81.89-3.42 2.26-4.4C12.92 3.04 12.46 3 12 3z" />
    </symbol>
    <symbol id="icon-search" viewBox="0 0 24 24">
      <path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z" />
    </symbol>
    <symbol id="icon-category" viewBox="0 0 24 24">
      <path d="M12 2l-5.5 9h11zM3 13.5h8v8H3zM16.5 13.5c-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4-1.79-4-4-4z" />
    </symbol>
    <symbol id="icon-back" viewBox="0 0 24 24">
      <path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z" />
    </symbol>
    <symbol id="icon-sync" viewBox="0 0 24 24">
      <path d="M12 4V1L8 5l4 4V6c3.31 0 6 2.69 6 6 0 1.01-.25 1.97-.7 2.8l1.46 1.46C19.54 15.03 20 13.57 20 12c0-4.42-3.58-8-8-8zm0 14c-3.31 0-6-2.69-6-6 0-1.01.25-1.97.7-2.8L5.24 7.74C4.46 8.97 4 10.43 4 12c0 4.42 3.58 8 8 8v3l4-4-4-4v3z" />
    </symbol>
    <symbol id="icon-close" viewBox="0 0 24 24">
      <path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z" />
    </symbol>
    <symbol id="icon-check" viewBox="0 0 24 24">
      <path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z" />
    </symbol>
    <symbol id="icon-bookmark" viewBox="0 0 24 24">
      <path d="M17 3H7c-1.1 0-1.99.9-1.99 2L5 21l7-3 7 3V5c0-1.1-.9-2-2-2zm0 15l-5-2.18L7 18V5h10v13z" />
    </symbol>
    <symbol id="icon-bookmark-filled" viewBox="0 0 24 24">
      <path d="M17 3H7c-1.1 0-2 .9-2 2v16l7-3 7 3V5c0-1.1-.9-2-2-2z" />
    </symbol>
    <symbol id="icon-share" viewBox="0 0 24 24">
      <path d="M18 16.08c-.76 0-1.44.3-1.96.77L8.91 12.7c.05-.23.09-.46.09-.7s-.04-.47-.09-.7l7.05-4.11c.54.5 1.25.81 2.04.81 1.66 0 3-1.34 3-3s-1.34-3-3-3-3 1.34-3 3c0 .24.04.47.09.7L8.04 9.81C7.5 9.31 6.79 9 6 9c-1.66 0-3 1.34-3 3s1.34 3 3 3c.79 0 1.5-.31 2.04-.81l7.12 4.16c-.05.21-.08.43-.08.65 0 1.61 1.31 2.92 2.92 2.92s2.92-1.31 2.92-2.92c0-1.61-1.31-2.92-2.92-2.92z" />
    </symbol>
    <symbol id="icon-filter" viewBox="0 0 24 24">
      <path d="M10 18h4v-2h-4v2zM3 6v2h18V6H3zm3 7h12v-2H6v2z" />
    </symbol>
    <symbol id="icon-toc" viewBox="0 0 24 24">
      <path d="M3 9h14V7H3v2zm0 4h14v-2H3v2zm0 4h14v-2H3v2zm16 0h2v-2h-2v2zm0-10v2h2V7h-2zm0 6h2v-2h-2v2z" />
    </symbol>
  </svg>

  <div id="app">
    <!-- NAVIGATION -->
    <nav class="navbar">
      <a class="brand" onclick="clearFiltersAndHome()" title="Home | Reset all filters">
        <img class="icon" src="favicon.ico" alt="logo" />
        <span>Clog Reader</span>
      </a>
      <div class="nav-controls">
        <div class="status-badge" id="source-badge" title="Database Sync Method">Sync Status</div>
        <button class="btn" id="nav-bookmark-toggle" onclick="toggleBookmarkOnlyView()" title="Toggle Bookmarked Items">
          <svg class="icon">
            <use href="#icon-bookmark"></use>
          </svg> <span class="nav-btn-text">Bookmarks</span>
        </button>
        <button class="btn" onclick="toggleTheme()" style="padding: 6px 12px; font-size: 0.8rem;" title="Switch Color Theme">
          <svg class="icon">
            <use href="#icon-theme"></use>
          </svg> <span class="nav-btn-text">Theme</span>
        </button>
      </div>
    </nav>

    <!-- SEARCH & MOBILE FILTER ROW -->
    <div class="search-and-filter-bar" id="main-search-container">
      <div class="search-wrapper">
        <svg class="icon search-icon">
          <use href="#icon-search"></use>
        </svg>
        <input type="search" class="search-input" id="search-bar" placeholder="Search publications by title, tags, summaries, authors..." oninput="handleSearchInput()" title="Type to filter results">
      </div>
      <button class="btn filter-toggle-btn" id="filter-drawer-toggle" onclick="toggleFilterDrawer()" title="Filter by Category">
        <svg class="icon">
          <use href="#icon-filter"></use>
        </svg> Filter
      </button>
    </div>

    <!-- MOBILE SIDEBAR OVERLAY BACKDROP -->
    <div class="sidebar-overlay" id="sidebar-overlay" onclick="toggleFilterDrawer()"></div>

    <!-- LAYOUT GRID -->
    <div class="layout-grid" id="main-layout-wrapper">

      <!-- SIDEBAR FILTERS -->
      <aside class="sidebar" id="sidebar-filters">
        <!-- Categories Multi-Select -->
        <div class="sidebar-card">
          <div class="sidebar-title" title="Select one or multiple categories to filter publications">
            <svg class="icon">
              <use href="#icon-category"></use>
            </svg> Categories
          </div>
          <ul class="filter-list" id="category-filter-list">
            <!-- Populated by JS -->
          </ul>
        </div>
      </aside>

      <!-- MAIN PUBLICATIONS -->
      <main class="content-area">
        <div class="grid-header">
          <span id="results-count">Retrieving publications...</span>
          <button class="btn btn-danger hidden" id="clear-filters-btn" onclick="clearFiltersAndHome()" style="padding: 4px 10px; font-size: 0.8rem;" title="Reset all search queries, author, category and tag filters">
            <svg class="icon" style="width: 1rem; height: 1rem;">
              <use href="#icon-close"></use>
            </svg> Clear Filters
          </button>
        </div>
        
        <div class="post-grid" id="publication-grid">
          <!-- INITIAL SKELETON CARDS FOR SMOOTHER PERCEIVED PERFORMANCE -->
          <div class="skeleton-card">
            <div class="skeleton-img"></div>
            <div class="skeleton-content">
              <div class="skeleton-line skeleton-meta"></div>
              <div class="skeleton-line skeleton-title"></div>
              <div class="skeleton-line skeleton-text"></div>
              <div class="skeleton-line skeleton-text-short"></div>
            </div>
          </div>
          <div class="skeleton-card">
            <div class="skeleton-img"></div>
            <div class="skeleton-content">
              <div class="skeleton-line skeleton-meta"></div>
              <div class="skeleton-line skeleton-title"></div>
              <div class="skeleton-line skeleton-text"></div>
              <div class="skeleton-line skeleton-text-short"></div>
            </div>
          </div>
          <div class="skeleton-card">
            <div class="skeleton-img"></div>
            <div class="skeleton-content">
              <div class="skeleton-line skeleton-meta"></div>
              <div class="skeleton-line skeleton-title"></div>
              <div class="skeleton-line skeleton-text"></div>
              <div class="skeleton-line skeleton-text-short"></div>
            </div>
          </div>
        </div>
      </main>
    </div>

    <!-- SINGLE POST READER -->
    <div class="reader-pane" id="main-reader-pane">
      <div class="back-btn-wrapper">
        <button class="btn" onclick="exitReaderView()" title="Return to publication list">
          <svg class="icon">
            <use href="#icon-back"></use>
          </svg> Back to Publications
        </button>
      </div>

      <article class="clog-container">
        <div class="clog-content">

          <div class="clog-meta" id="full-meta-block">
            <div class="clog-meta-sub">
              <div class="clog-meta-item"><span>Date:</span> <time id="full-date"></time></div>
              <div class="clog-meta-item"><span>Author:</span> <span id="full-author" class="clickable-author" title="Filter by this author" style="cursor: pointer; text-decoration: underline;"></span></div>
              <div class="clog-meta-item" id="reading-time-wrapper"><span>Reading Time:</span> <span id="reading-time">Calculating...</span></div>
            </div>
            
            <div class="clog-meta-row-two">
              <div class="clog-meta-item clog-tags" id="full-tags"></div>
              <div class="reader-action-buttons">
                <button class="btn btn-action-sm" id="bookmark-action-btn" title="Save this article">
                  <svg class="icon"><use href="#icon-bookmark"></use></svg> Save
                </button>
                <button class="btn btn-action-sm" id="share-action-btn" title="Share article link">
                  <svg class="icon"><use href="#icon-share"></use></svg> Share
                </button>
              </div>
            </div>
          </div>

          <!-- COLLAPSIBLE TABLE OF CONTENTS -->
          <details class="clog-toc-wrapper" id="toc-container">
            <summary class="toc-title">
              <svg class="icon"><use href="#icon-toc"></use></svg> Table of Contents
            </summary>
            <nav class="toc-list" id="toc-list">
              <!-- Dynamically populated via reader.js -->
            </nav>
          </details>

          <div class="markdown-body" style="background: transparent;" id="full-body">
            <!-- Markdown content or 404 injected here -->
          </div>
        </div>
      </article>
    </div>

    <!-- LOADER -->
    <div id="loader-status" style="display:none;">
      <div class="loading-spinner">
        <svg class="icon" style="width: 3rem; height: 3rem; color: var(--primary); animation: spin 1s linear infinite;">
          <use href="#icon-sync"></use>
        </svg>
        <span>Processing request...</span>
      </div>
    </div>
  </div>

  <script src="reader.js"></script>
  <script src="libs/toaster.js"></script>
</body>

</html>
